#!/usr/sbin/nft -f
# ============================================================
# SOC Lab Firewall - nftables configuration
# Topology:
#   victim1         172.18.0.6  - attacker/lab machine
#   juice-shop      172.18.0.5  - target web app (port 3000)
#   wazuh.manager   172.18.0.4  - SIEM manager
#   wazuh.dashboard 172.18.0.3  - SIEM dashboard (HTTPS 443)
#   wazuh.indexer   172.18.0.2  - SIEM indexer
# ============================================================

flush ruleset

# -----------------------------------------------------------
# Define named sets for clarity
# -----------------------------------------------------------
define VICTIM1           = 172.18.0.6
define JUICE_SHOP        = 172.18.0.5
define WAZUH_MANAGER     = 172.18.0.4
define WAZUH_DASHBOARD   = 172.18.0.3
define WAZUH_INDEXER     = 172.18.0.2
define SOC_SUBNET        = 172.18.0.0/16

table inet soc_firewall {

    # ----------------------------------------------------------
    # Counters (visible via: nft list counters)
    # ----------------------------------------------------------
    counter cnt_victim_to_juiceshop {}
    counter cnt_victim_blocked      {}
    counter cnt_wazuh_internal      {}
    counter cnt_dropped_total       {}

    # ----------------------------------------------------------
    # Rate limiting - brute force protection
    # victim1 → juice-shop HTTP limited to 60 new conn/min
    # ----------------------------------------------------------
    set brute_force_block {
        type ipv4_addr
        flags dynamic, timeout
        timeout 5m
        size 1024
    }

    # ----------------------------------------------------------
    # INPUT chain  (traffic destined to this firewall container)
    # ----------------------------------------------------------
    chain input {
        type filter hook input priority 0; policy drop;

        # Allow established/related connections
        ct state established,related accept

        # Allow loopback
        iif lo accept

        # Allow ICMP (ping) for diagnostics
        ip protocol icmp accept

        # Allow SSH from SOC subnet only (for management)
        ip saddr $SOC_SUBNET tcp dport 22 ct state new accept

        # Drop everything else to the firewall itself
        counter name cnt_dropped_total drop
    }

    # ----------------------------------------------------------
    # FORWARD chain  (traffic routed through this container)
    # ----------------------------------------------------------
    chain forward {
        type filter hook forward priority 0; policy drop;

        # Allow established/related in both directions
        ct state established,related accept

        # Drop invalid state packets
        ct state invalid counter name cnt_dropped_total drop

        # ---- victim1 → juice-shop (HTTP :3000) ---------------
        # Allow HTTP to juice-shop from victim1 (the test target)
        ip saddr $VICTIM1 ip daddr $JUICE_SHOP tcp dport 3000 \
            ct state new \
            counter name cnt_victim_to_juiceshop \
            accept

        # ---- victim1 → wazuh agent comms (port 1514, 1515) ---
        # Allow victim1 agent to talk to manager
        ip saddr $VICTIM1 ip daddr $WAZUH_MANAGER tcp dport { 1514, 1515 } \
            ct state new accept

        # ---- BLOCK victim1 from reaching internal SOC infra --
        # victim1 must NOT reach the dashboard, indexer, or
        # manager on any other port
        ip saddr $VICTIM1 ip daddr { $WAZUH_MANAGER, $WAZUH_DASHBOARD, $WAZUH_INDEXER } \
            counter name cnt_victim_blocked \
            log prefix "FW-BLOCK-VICTIM: " flags all \
            drop

        # ---- Wazuh internal SOC traffic ----------------------
        # manager <-> indexer (9200, 9300)
        ip saddr $WAZUH_MANAGER ip daddr $WAZUH_INDEXER \
            tcp dport { 9200, 9300 } \
            counter name cnt_wazuh_internal accept

        # indexer -> manager replies handled by ct state above
        # dashboard <-> manager API (55000)
        ip saddr $WAZUH_DASHBOARD ip daddr $WAZUH_MANAGER \
            tcp dport 55000 \
            counter name cnt_wazuh_internal accept

        # dashboard <-> indexer (9200)
        ip saddr $WAZUH_DASHBOARD ip daddr $WAZUH_INDEXER \
            tcp dport 9200 \
            counter name cnt_wazuh_internal accept

        # manager -> indexer filebeat SSL (9200)
        ip saddr $WAZUH_MANAGER ip daddr $WAZUH_INDEXER \
            tcp dport 9200 accept

        # Allow all SOC internal traffic within the subnet
        # (indexer, dashboard, manager inter-node clustering)
        ip saddr $SOC_SUBNET ip daddr $SOC_SUBNET \
            ip saddr != $VICTIM1 \
            counter name cnt_wazuh_internal \
            accept

        # ---- Default: log and drop everything else -----------
        counter name cnt_dropped_total \
            log prefix "FW-DROP-FORWARD: " flags all \
            drop
    }

    # ----------------------------------------------------------
    # OUTPUT chain  (traffic originating from this container)
    # ----------------------------------------------------------
    chain output {
        type filter hook output priority 0; policy accept;
        # Permissive - firewall container itself can reach all
    }

    # ----------------------------------------------------------
    # POSTROUTING  (NAT - masquerade for forwarded traffic)
    # ----------------------------------------------------------
    chain postrouting {
        type nat hook postrouting priority srcnat;
        # Masquerade forwarded traffic so replies return through fw
        oif != lo masquerade
    }
}
